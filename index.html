<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Screen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffb6c1; /* خلفية بينك ناعمة */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* تأثير تساقط القلوب */
    .heart-fall {
      position: fixed;
      top: -10%;
      color: #ff1493;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* حاوية الكلمات المكررة */
    .container {
      position: relative;
      z-index: 2;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .love-text {
      color: #d81b60;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s;
    }

    .love-text:hover {
      transform: scale(1.3);
      color: #ff0055;
    }
  </style>
</head>
<body>

  <div class="container" id="textContainer"></div>

  <script>
    // 1. تكرار كلمة "بحبك" 2000 مرة
    const container = document.getElementById('textContainer');
    const totalWords = 2000;

    for (let i = 0; i < totalWords; i++) {
      const span = document.createElement('span');
      span.className = 'love-text';
      span.textContent = 'بحبك ❤️';
      container.appendChild(span);
    }

    // 2. إنشاء قلوب متحركة ومتساقطة في الخلفية
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart-fall';
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 3 + 2 + 's';
      heart.style.fontSize = Math.random() * 20 + 15 + 'px';
      
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 150);
  </script>
</body>
</html>
